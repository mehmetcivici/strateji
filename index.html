<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#111;color:#eee;

  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;

body{position:fixed;left:0;top:0;right:0;bottom:0}
.bar{position:absolute;left:0;right:0;height:54px;background:#1f1f24;white-space:nowrap;overflow:hidden;
  box-sizing:border-box;padding:5px 4px}
#top{top:0;border-bottom:1px solid #333}
#bot{bottom:0;border-top:1px solid #333}
.btn{display:inline-block;vertical-align:top;height:44px;min-width:44px;line-height:44px;padding:0 9px;margin:0 2px;
  box-sizing:border-box;border-radius:8px;background:#2e2e35;color:#eee;font-size:15px;text-align:center}
.btn.on{background:#0a84ff;color:#fff}
.sep{display:inline-block;width:8px;height:44px}
.sw{display:inline-block;vertical-align:top;width:36px;height:36px;margin:4px 3px;border-radius:18px;
  box-sizing:border-box;border:3px solid #444}
.sw.on{border-color:#fff;-webkit-box-shadow:0 0 0 2px #0a84ff;box-shadow:0 0 0 2px #0a84ff}
.wd{display:inline-block;background:#eee;border-radius:50%;vertical-align:middle}
#right{position:absolute;right:4px;top:5px}
#stage{position:absolute;left:0;right:0;top:54px;bottom:54px;background:#111;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
#bg{background:#222}
.robot{position:absolute;left:0;top:0;box-sizing:border-box;border-radius:6px;border:3px solid #fff;
  color:#fff;font-weight:bold;text-align:center;overflow:hidden;
  -webkit-box-shadow:0 2px 6px rgba(0,0,0,.6);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.robot.r{background:#d70015}
.robot.b{background:#0040dd}
.robot.drag{border-color:#ffd60a}
#panel{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none}
#panel .box{position:absolute;left:50%;top:40px;width:420px;margin-left:-210px;background:#26262c;border-radius:14px;padding:16px;box-sizing:border-box}
#panel h3{margin:0 0 10px 0;font-size:18px}
.row{margin:6px 0}
.row label{display:inline-block;width:60px;font-weight:bold}
.row input{width:150px;height:38px;font-size:20px;border-radius:8px;border:0;padding:0 8px;-webkit-user-select:text;user-select:text}
.lr{color:#ff6961}.lb{color:#5ac8fa}
.cols{overflow:hidden}
.col{float:left;width:50%}
.acts{margin-top:14px;text-align:right}
@media (max-width:900px){.lbl{display:none}.sw{margin:4px 2px}.sep{width:4px}#panel .box{top:20px}}
</style>

    var bx = x2 - Math.cos(ang) * head * 0.8, by = y2 - Math.sin(ang) * head * 0.8;
    ctx.save(); styleFor(ctx, s);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(bx, by); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(ang - 0.45) * head, y2 - Math.sin(ang - 0.45) * head);
    ctx.lineTo(x2 - Math.cos(ang + 0.45) * head, y2 - Math.sin(ang + 0.45) * head);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawStroke(ctx, s) {
    if (s.t === 'a') { drawArrow(ctx, s); return; }
    var p = s.p;
    ctx.save(); styleFor(ctx, s);
    ctx.beginPath();
    ctx.moveTo(p[0] * G.FW, p[1] * G.FH);
    if (p.length === 2) ctx.lineTo(p[0] * G.FW + 0.01, p[1] * G.FH);
    for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * G.FW, p[i + 1] * G.FH);
    ctx.stroke(); ctx.restore();
  }
  function redrawInk() {
    clearCtx(inkCtx, ink);
    var st = page().strokes;
    for (var i = 0; i < st.length; i++) drawStroke(inkCtx, st[i]);
  }

  function pushUndo() {
    undoStack.push(page().strokes);
    if (undoStack.length > 60) undoStack.shift();
    redoStack = [];
  }
  function commit(s) {
    pushUndo();
    page().strokes = page().strokes.concat([s]);
    save();
  }

  // ---------- dokunma: çizim ----------
  var drawId = null, cur = null, lastB = null, startB = null;

  function startDraw(id, cx, cy) {
    if (drawId !== null) return;
    drawId = id;
    var b = clientToBox(cx, cy), f = fromBox(b[0], b[1]);
    cur = {t: state.tool, c: COLORS[state.color], w: WIDTHS[state.width], p: [r4(f[0]), r4(f[1])]};
    lastB = b; startB = b;
    if (cur.t !== 'a') drawSeg(inkCtx, cur, cur.p[0], cur.p[1], cur.p[0], cur.p[1]);
  }
  function moveDraw(cx, cy) {
    var b = clientToBox(cx, cy), f = fromBox(b[0], b[1]);
    if (cur.t === 'a') {
      cur.p = [cur.p[0], cur.p[1], r4(f[0]), r4(f[1])];
      clearCtx(tmpCtx, tmp);
      if (dist(b, startB) > 8) drawArrow(tmpCtx, cur);
      return;
    }
    if (dist(b, lastB) < 2) return;
    var n = cur.p.length;
    var u = r4(f[0]), v = r4(f[1]);
    drawSeg(inkCtx, cur, cur.p[n - 2], cur.p[n - 1], u, v);
    cur.p.push(u, v);
    lastB = b;
  }
  function endDraw() {
    if (cur) {
      if (cur.t === 'a') {
        clearCtx(tmpCtx, tmp);
        if (cur.p.length === 4) {
          var e = toBox(cur.p[2], cur.p[3]);
          if (dist(e, startB) > 12) { commit(cur); drawArrow(inkCtx, cur); }
        }
      } else {
        commit(cur);
      }
    }
    drawId = null; cur = null;
  }
  function dist(a, b) { var dx = a[0] - b[0], dy = a[1] - b[1]; return Math.sqrt(dx * dx + dy * dy); }

  // ---------- robotlar ----------
  var robotEls = [], drags = {};
  function buildRobots() {
    robotsEl.innerHTML = '';
    robotEls = [];
    for (var i = 0; i < 6; i++) {
      var d = document.createElement('div');
      d.className = 'robot ' + (i < 3 ? 'r' : 'b');
      d.setAttribute('data-i', i);
      robotsEl.appendChild(d);
      robotEls.push(d);
      bindRobot(d, i);
    }
    labelRobots();
  }
  function labelRobots() {
    for (var i = 0; i < 6; i++) {
      var t = state.teams[i];
      robotEls[i].innerHTML = t ? t : (i < 3 ? 'K' : 'M') + (i % 3 + 1);
    }
  }
  function placeRobots() {
    var size = Math.max(34, Math.round(ROBOT * G.FW));
    var rs = page().robots;
    for (var i = 0; i < 6; i++) {
      var el = robotEls[i], b = toBox(rs[i].u, rs[i].v);
      el.style.width = size + 'px'; el.style.height = size + 'px';
      el.style.lineHeight = (size - 6) + 'px';
      el.style.fontSize = Math.max(11, Math.round(size * 0.3)) + 'px';
      var x = Math.round(G.x + b[0] - size / 2), y = Math.round(G.y + b[1] - size / 2);
      var tr = 'translate3d(' + x + 'px,' + y + 'px,0)';
      el.style.webkitTransform = tr; el.style.transform = tr;
    }
  }
  function startDrag(id, i, cx, cy) {
    drags[id] = i;
    robotEls[i].className += ' drag';
  }
  function moveDrag(id, cx, cy) {
    var i = drags[id], b = clientToBox(cx, cy), f = fromBox(b[0], b[1]);
    page().robots[i] = {u: r4(clamp(f[0])), v: r4(clamp(f[1]))};
    placeRobots();
  }
  function endDrag(id) {
    var i = drags[id];
    robotEls[i].className = robotEls[i].className.replace(' drag', '');
    delete drags[id];
    save();
  }
  function bindRobot(el, i) {
    el.addEventListener('touchstart', function (e) {
      e.preventDefault(); e.stopPropagation();
      var t = e.changedTouches[0];
      startDrag(t.identifier, i, t.clientX, t.clientY);
    }, false);
    el.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      startDrag('m', i, e.clientX, e.clientY);
    }, false);
  }

  // ---------- olaylar ----------
  stage.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    startDraw(t.identifier, t.clientX, t.clientY);
  }, false);
  stage.addEventListener('mousedown', function (e) {
    e.preventDefault();
    startDraw('m', e.clientX, e.clientY);
  }, false);

  function onMove(id, cx, cy) {
    if (drags.hasOwnProperty(id)) moveDrag(id, cx, cy);
    else if (id === drawId) moveDraw(cx, cy);
  }
  function onEnd(id) {
    if (drags.hasOwnProperty(id)) endDrag(id);
    else if (id === drawId) endDraw();
  }
  document.addEventListener('touchmove', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag !== 'INPUT') e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      onMove(t.identifier, t.clientX, t.clientY);
    }
  }, false);
  function touchEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++) onEnd(e.changedTouches[i].identifier);
  }
  document.addEventListener('touchend', touchEnd, false);
  document.addEventListener('touchcancel', touchEnd, false);
  document.addEventListener('mousemove', function (e) { onMove('m', e.clientX, e.clientY); }, false);
  document.addEventListener('mouseup', function () { onEnd('m'); }, false);

  // dokunmada 300 ms gecikme olmadan buton
  function tap(el, fn) {
    var touched = false;
    el.addEventListener('touchend', function (e) { e.preventDefault(); touched = true; fn(e); }, false);
    el.addEventListener('click', function (e) { if (touched) { touched = false; return; } fn(e); }, false);
  }

  // ---------- araç çubuğu ----------
  var sws = $('swatches');
  for (var ci = 0; ci < COLORS.length; ci++) {
    var s = document.createElement('span');
    s.className = 'sw'; s.style.background = COLORS[ci]; s.setAttribute('data-c', ci);
    sws.appendChild(s);
    (function (k) { tap(s, function () { state.color = k; if (state.tool === 'e') state.tool = 'p'; refreshUI(); save(); }); })(ci);
  }
  var toolBtns = document.querySelectorAll('.tool');
  for (var ti = 0; ti < toolBtns.length; ti++) {
    (function (el) { tap(el, function () { state.tool = el.getAttribute('data-t'); refreshUI(); save(); }); })(toolBtns[ti]);
  }
  var wBtns = document.querySelectorAll('.wbtn');
  for (var wi = 0; wi < wBtns.length; wi++) {
    (function (el) { tap(el, function () { state.width = +el.getAttribute('data-w'); refreshUI(); save(); }); })(wBtns[wi]);
  }
  tap($('undo'), function () {
    if (!undoStack.length) return;
    redoStack.push(page().strokes);
    page().strokes = undoStack.pop();
    redrawInk(); save();
  });
  tap($('redo'), function () {
    if (!redoStack.length) return;
    undoStack.push(page().strokes);
    page().strokes = redoStack.pop();
    redrawInk(); save();
  });
  tap($('clear'), function () {
    if (!page().strokes.length) return;
    pushUndo(); page().strokes = []; redrawInk(); save();
  });
  tap($('flip'), function () { state.flip = !state.flip; refreshUI(); layout(); save(); });
  tap($('dim'), function () { state.dim = !state.dim; refreshUI(); drawBg(); save(); });

  function refreshUI() {
    var i;
    for (i = 0; i < toolBtns.length; i++)
      toolBtns[i].className = 'btn tool' + (toolBtns[i].getAttribute('data-t') === state.tool ? ' on' : '');
    for (i = 0; i < wBtns.length; i++)
      wBtns[i].className = 'btn wbtn' + (+wBtns[i].getAttribute('data-w') === state.width ? ' on' : '');
    var ss = sws.childNodes;
    for (i = 0; i < ss.length; i++)
      ss[i].className = 'sw' + (i === state.color && state.tool !== 'e' ? ' on' : '');
    $('flip').className = 'btn' + (state.flip ? ' on' : '');
    $('dim').className = 'btn' + (state.dim ? ' on' : '');
  }

  // ---------- sayfalar ----------
  function renderTabs() {
    var tabs = $('tabs');
    tabs.innerHTML = '';
    for (var i = 0; i < state.pages.length; i++) {
      var b = document.createElement('span');
      b.className = 'btn' + (i === state.cur ? ' on' : '');
      b.appendChild(document.createTextNode(state.pages[i].name));
      tabs.appendChild(b);
      (function (k) { tap(b, function () { switchPage(k); }); })(i);
    }
  }
  function switchPage(k) {
    if (k === state.cur) return;
    if (drawId !== null) endDraw();
    state.cur = k; undoStack = []; redoStack = [];
    renderTabs(); redrawInk(); placeRobots(); save();
  }
  tap($('addpage'), function () {
    var src = page();
    var p = newPage('Sayfa ' + (state.pages.length + 1));
    p.robots = JSON.parse(JSON.stringify(src.robots));
    state.pages.push(p);
    switchPage(state.pages.length - 1);
  });

  // ---------- paneller ----------
  var panel = $('panel'), pbox = $('pbox');
  function openPanel(html) { pbox.innerHTML = html; panel.style.display = 'block'; }
  function closePanel() { panel.style.display = 'none'; pbox.innerHTML = ''; }
  function btnHtml(id, label) { return '<span class="btn" id="' + id + '">' + label + '</span>'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  tap($('teamsbtn'), function () {
    var h = '<h3>Takım numaraları</h3><div class="cols">';
    for (var c = 0; c < 2; c++) {
      h += '<div class="col">';
      for (var k = 0; k < 3; k++) {
        var i = c * 3 + k;
        h += '<div class="row"><label class="' + (c ? 'lb' : 'lr') + '">' + (c ? 'Mavi ' : 'Kırm. ') + (k + 1) +
             '</label><input id="tm' + i + '" type="text" pattern="[0-9]*" inputmode="numeric" maxlength="5" value="' +
             esc(state.teams[i] || '') + '"></div>';
      }
      h += '</div>';
    }
    h += '</div><div class="acts">' + btnHtml('newmatch', 'Yeni maç') + btnHtml('swapall', 'Renkleri değiştir') +
         btnHtml('tmok', 'Tamam') + '</div>';
    openPanel(h);
    tap($('tmok'), function () {
      for (var i = 0; i < 6; i++) state.teams[i] = $('tm' + i).value.replace(/[^0-9]/g, '');
      labelRobots(); save(); closePanel();
    });
    tap($('swapall'), function () {
      for (var i = 0; i < 3; i++) {
        var a = $('tm' + i), b = $('tm' + (i + 3)), t = a.value;
        a.value = b.value; b.value = t;
      }
    });
    tap($('newmatch'), function () {
      if (!confirm('Tüm sayfalardaki çizimler silinsin ve robotlar başa dönsün mü?')) return;
      for (var i = 0; i < state.pages.length; i++) {
        state.pages[i].strokes = []; state.pages[i].robots = defaultRobots();
      }
      for (var j = 0; j < 6; j++) state.teams[j] = $('tm' + j).value.replace(/[^0-9]/g, '');
      undoStack = []; redoStack = [];
      labelRobots(); redrawInk(); placeRobots(); save(); closePanel();
    });
  });

  tap($('pagemenu'), function () {
    var h = '<h3>' + esc(page().name) + '</h3><div class="acts" style="text-align:left">' +
      btnHtml('pmrename', 'Adını değiştir') + btnHtml('pmdup', 'Kopyala') +
      btnHtml('pmreset', 'Robotları başa al') + btnHtml('pmdel', 'Sil') +
      '</div><div class="acts">' + btnHtml('pmclose', 'Kapat') + '</div>';
    openPanel(h);
    tap($('pmclose'), closePanel);
    tap($('pmrename'), function () {
      var n = prompt('Sayfa adı', page().name);
      if (n) { page().name = n.substring(0, 16); renderTabs(); save(); }
      closePanel();
    });
    tap($('pmdup'), function () {
      var c = JSON.parse(JSON.stringify(page()));
      c.name = (c.name + ' 2').substring(0, 16);
      state.pages.splice(state.cur + 1, 0, c);
      closePanel(); switchPage(state.cur + 1);
    });
    tap($('pmreset'), function () { page().robots = defaultRobots(); placeRobots(); save(); closePanel(); });
    tap($('pmdel'), function () {
      if (state.pages.length < 2) { closePanel(); return; }
      if (!confirm('"' + page().name + '" silinsin mi?')) return;
      state.pages.splice(state.cur, 1);
      var k = state.cur > 0 ? state.cur - 1 : 0;
      state.cur = -1; closePanel(); switchPage(k);
    });
  });
  panel.addEventListener('touchstart', function (e) { if (e.target === panel) { e.preventDefault(); closePanel(); } }, false);
  panel.addEventListener('mousedown', function (e) { if (e.target === panel) closePanel(); }, false);

  // ---------- başlat ----------
  var rt = null;
  function relayout() { if (rt) clearTimeout(rt); rt = setTimeout(layout, 120); }
  window.addEventListener('resize', relayout, false);
  window.addEventListener('orientationchange', relayout, false);

  img.onload = function () { imgReady = true; drawBg(); };
  img.src = FIELD_SRC;

  // AppCache güncellemesi gelirse yeni sürüme geç
  try {
    var ac = window.applicationCache;
    if (ac) ac.addEventListener('updateready', function () {
      try { ac.swapCache(); } catch (e) {}
      location.reload();
    }, false);
  } catch (e) {}

  buildRobots(); renderTabs(); refreshUI(); layout();
})();
</script>
</body>
</html>
